name: Release macOS

# a_ 로 시작하는 태그(예: a_9.1.0-beta.1)를 올리면 macOS 판 .dmg 를 만들어 GitHub 릴리스에 올립니다.
#  - 태그가 앱 버전(csharp/src/Atbash.App/Atbash.App.csproj 의 Version)과 맞지 않으면 멈춤
#  - 버전에 -beta 처럼 "-" 가 있으면 Pre-release
#  - Mac 릴리스는 절대 "Latest" 로 표시하지 않음 (Latest 는 Windows 릴리스만: csharp/RELEASING.md)
#  - version.json 은 건드리지 않음 (베타는 DM 으로만 나눔. 정식 Mac 출시 때 따로 반영)
on:
  push:
    tags: ['a_*']

permissions:
  contents: write # 릴리스를 만들고 파일을 올리기 위해

jobs:
  release:
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: csharp/global.json

      - name: Check that the tag matches the app version
        id: version
        run: |
          version="$(dotnet msbuild csharp/src/Atbash.App/Atbash.App.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          expected="$(dotnet run --project csharp/tools/ReleaseTool -c Release -v q -- tag --platform osx-arm64 --version "$version" | tr -d '[:space:]')"
          echo "app version: $version, expected tag: $expected, pushed tag: $TAG"
          if [ "$expected" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the app version $version (expected $expected)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          swiftc -O -target arm64-apple-macos13.0 csharp/packaging/macos/VisionOcr.swift -o "$RUNNER_TEMP/atbash-vision-ocr"
          ATBASH_VISION_OCR="$RUNNER_TEMP/atbash-vision-ocr" dotnet test csharp/AtbashCipher.sln

      - name: Build .app and .dmg
        run: bash csharp/packaging/macos/build-dmg.sh out

      - name: Smoke test (start the app from the .dmg)
        run: |
          dmg="$(ls out/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          cp -R "$mnt/Atbash Cipher Tool.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt" -quiet
          app="$RUNNER_TEMP/Atbash Cipher Tool.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/AtbashCipherTool" > app.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 $pid 2>/dev/null; then echo "app is running after 20s"; kill $pid; else echo "app exited early"; cat app.log; exit 1; fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          macOS (Apple Silicon, M1 이상) 용 Atbash Cipher Tool $VERSION 입니다.

          - 받을 파일: \`$(basename out/*.dmg)\`
          - macOS 13 (Ventura) 이상, Intel Mac 은 지원하지 않습니다.
          - Apple 개발자 인증을 받지 않은 앱이라 처음 열 때 macOS 가 막습니다.
            **시스템 설정 → 개인정보 보호 및 보안 → 그래도 열기** 로 한 번 허용해 주세요.
          - SHA-256: \`$(cut -d' ' -f1 out/*.sha256)\`
          EOF
          gh release create "$TAG" out/*.dmg out/*.sha256 \
            --title "macOS $VERSION" --notes-file notes.md --verify-tag --latest=false $prerelease
          echo "::notice title=Release::$(gh release view "$TAG" --json url --jq .url)"
