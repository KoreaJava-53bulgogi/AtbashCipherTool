name: CI

# Windows · macOS · Linux 에서 같은 테스트를 돌립니다.
# 목적: 코드를 바꿀 때마다 "세 운영체제에서 다 되는지"를 자동으로 확인.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # 한 곳이 실패해도 나머지 결과는 끝까지 확인
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # 화면 테스트가 그린 창 이미지를 모아 두는 폴더 (아래에서 업로드)
      ATBASH_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: csharp/global.json

      # Java 8.x 앱과 AES·업데이트 파일 형식이 서로 호환되는지 확인하는 테스트용.
      # 운영체제마다 암호 라이브러리가 달라서(Windows·macOS·Linux 각자의 것) 세 곳 모두에서 확인함.
      # 그 테스트는 Java 클래스가 있으면 자동으로 실행되고, 없으면 건너뜀.
      - name: Set up Java (interop tests)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile the Java classes used by the interop tests
        shell: bash
        run: |
          mkdir -p target/classes
          javac -encoding UTF-8 -d target/classes AESFileCipher.java UpdateChecker.java
          ls target/classes

      # Linux 의 OCR 은 시스템 tesseract 명령을 씀 → 설치해서 실제로 글자를 읽는 테스트까지 돌림.
      # 한글 글꼴(Noto CJK)도 설치: 없으면 테스트가 그리는 그림에 한글이 네모(□)로 나와서 읽을 수가 없음
      # (일반 Ubuntu·Kubuntu 데스크톱에는 기본으로 들어 있음).
      - name: Install Tesseract and Korean fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr fonts-noto-cjk

      # macOS 의 OCR 은 Apple Vision 도우미(Swift)를 씀 → 빌드해서 실제로 글자를 읽는 테스트까지 돌림
      - name: Build Apple Vision OCR helper (macOS)
        if: runner.os == 'macOS'
        run: |
          swiftc -O -target arm64-apple-macos13.0 csharp/packaging/macos/VisionOcr.swift -o "$RUNNER_TEMP/atbash-vision-ocr"
          echo "ATBASH_VISION_OCR=$RUNNER_TEMP/atbash-vision-ocr" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test csharp/AtbashCipher.sln --logger "GitHubActions" --logger trx --results-directory test-results

      # 통과·실패·건너뜀 개수와, 건너뛴 테스트가 무엇이고 왜인지를 안내(notice)로 남김.
      # (어느 운영체제에서 무엇을 건너뛰는지 한눈에 보려는 것 — 건너뜀이 조용히 늘어나는 것을 막음)
      # 안내만 하는 단계라서, 여기서 문제가 생겨도 전체 결과를 실패로 만들지 않음 (테스트 실패는 위 단계가 알려 줌)
      - name: Test report
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $ns = New-Object System.Xml.XmlNamespaceManager((New-Object System.Xml.NameTable))
          $ns.AddNamespace('t', 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010')
          $passed = 0; $failed = 0; $skipped = 0
          foreach ($file in Get-ChildItem -Recurse -Filter *.trx -Path test-results -ErrorAction SilentlyContinue) {
            # XML 에 쓸 수 없는 제어 문자(예: OCR 결과의 \f)가 섞여 있으면 빼고 읽음
            $raw = (Get-Content $file.FullName -Raw) -replace '[\x00-\x08\x0B\x0C\x0E-\x1F]', ''
            try { $xml = [xml]$raw } catch { Write-Host "::warning title=Test report::cannot read $($file.Name): $($_.Exception.Message)"; continue }
            foreach ($r in $xml.SelectNodes('//t:UnitTestResult', $ns)) {
              if ($r.outcome -eq 'Passed') { $passed++ }
              elseif ($r.outcome -eq 'Failed') { $failed++ }
              else {
                $skipped++
                $why = $r.SelectSingleNode('t:Output/t:ErrorInfo/t:Message', $ns)
                $text = if ($why) { ($why.InnerText -replace '\s+', ' ').Trim() } else { '' }
                Write-Host "::notice title=Skipped on ${{ matrix.os }}::$($r.testName) - $text"
              }
            }
          }
          Write-Host "::notice title=Totals on ${{ matrix.os }}::passed=$passed failed=$failed skipped=$skipped"

      # 배포용 빌드가 각 운영체제에서 만들어지는지 (설치 파일·.app·AppImage 만들기는 다음 단계)
      - name: Publish (release build for this OS)
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-*) rid=win-x64 ;;
            macos-*)   rid=osx-arm64 ;;
            *)         rid=linux-x64 ;;
          esac
          dotnet publish csharp/src/Atbash.App -c Release -r "$rid" -o "publish/$rid" --nologo
          ls "publish/$rid" | grep -E '^AtbashCipherTool(\.exe)?$'
          test -f "publish/$rid/tessdata/kor.traineddata"
          echo "::notice title=Publish $rid::$(ls "publish/$rid" | wc -l) files, $(du -sh "publish/$rid" | cut -f1)"

      - name: Upload window snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: snapshots-${{ matrix.os }}
          path: snapshots
          if-no-files-found: ignore
          retention-days: 14

  # 경량판 (Rust): Java 골든 벡터·AES 호환 테스트 + 배포용 빌드
  lite:
    name: Lite (Rust, Windows x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lite
    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lite/target
          key: lite-${{ runner.os }}-${{ hashFiles('lite/Cargo.lock') }}

      - name: Test
        run: cargo test --release

      - name: Build
        shell: pwsh
        run: |
          cargo build --release
          $exe = Get-Item target\release\AtbashCipherToolLite.exe
          Write-Host ("::notice title=Lite::AtbashCipherToolLite.exe {0:N1} MB, version {1}" -f ($exe.Length/1MB), $exe.VersionInfo.ProductVersion)

      - name: Upload exe
        uses: actions/upload-artifact@v6
        with:
          name: lite-win-x64
          path: lite/target/release/AtbashCipherToolLite.exe
          retention-days: 14

  # macOS .dmg: 만들고, 실제로 켜 보고, 화면을 찍어 둠 (Discord DM 베타용 파일)
  dmg:
    name: DMG (macOS Apple Silicon)
    runs-on: macos-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: csharp/global.json

      - name: Build .app and .dmg
        run: bash csharp/packaging/macos/build-dmg.sh out

      # .dmg 를 열어 앱을 꺼내고 20초 동안 켜 두어 꺼지지 않는지 확인 + 화면 찍기
      - name: Smoke test (start the app)
        run: |
          dmg="$(ls out/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach "$dmg" -mountpoint "$mnt" -nobrowse -quiet
          cp -R "$mnt/Atbash Cipher Tool.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt" -quiet
          app="$RUNNER_TEMP/Atbash Cipher Tool.app"
          codesign --verify --deep --strict "$app" && echo "ad-hoc signature OK"
          test -x "$app/Contents/MacOS/atbash-vision-ocr"
          spctl --assess --type execute "$app" 2>&1 || echo "(expected: not notarized, testers must allow it once)"
          "$app/Contents/MacOS/AtbashCipherTool" > app.log 2>&1 &
          pid=$!
          sleep 20
          screencapture -x screenshot.png || echo "screenshot not allowed on this runner"
          if kill -0 $pid 2>/dev/null; then echo "app is running after 20s"; kill $pid; else echo "app exited early"; cat app.log; exit 1; fi
          echo "--- app output:"; cat app.log || true
          echo "::notice title=DMG::$(basename "$dmg") $(du -h "$dmg" | cut -f1) - started and kept running"

      - name: Upload DMG and screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dmg-osx-arm64
          path: |
            out/*.dmg
            out/*.sha256
            screenshot.png
            app.log
          if-no-files-found: ignore
          retention-days: 14

  # Linux AppImage: 만들고, 가상 화면에서 실제로 켜 보고, 화면을 찍어 둠
  appimage:
    name: AppImage (Linux x64)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: csharp/global.json

      - name: Build AppImage
        run: bash csharp/packaging/linux/build-appimage.sh out

      # 가상 화면(Xvfb)에서 20초 동안 켜 두고 꺼지지 않는지 확인 + 화면 찍기.
      # 한글 글꼴(Noto CJK)을 넣어 실제 데스크톱과 비슷하게 함. 일반 Ubuntu 데스크톱에는 기본으로 들어 있음.
      - name: Smoke test (start the app on a virtual screen)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb imagemagick fonts-noto-cjk
          app="$(ls out/*.AppImage)"
          chmod +x "$app"
          export APPIMAGE_EXTRACT_AND_RUN=1
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            "'"$app"'" > app.log 2>&1 &
            pid=$!
            sleep 20
            import -window root screenshot.png
            if kill -0 $pid 2>/dev/null; then echo "app is running after 20s"; kill $pid; else echo "app exited early"; cat app.log; exit 1; fi
          '
          echo "--- app output:"; cat app.log || true
          echo "::notice title=AppImage::$(basename "$app") $(du -h "$app" | cut -f1) - started and kept running on Xvfb"

      - name: Upload AppImage and screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: appimage-linux-x64
          path: |
            out/*.AppImage
            out/*.sha256
            screenshot.png
            app.log
          if-no-files-found: ignore
          retention-days: 14
